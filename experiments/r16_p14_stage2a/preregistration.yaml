hypotheses:
  track_a: >-
    In a preregistered deferred-invalidation task family, continuing a
    still-valid nominal prefix and replanning at the last physically safe
    state reduces rework without degrading safety relative to immediate
    replanning.
  track_b: >-
    Physical safety and frozen-policy replanability are different. The best
    replanning prefix is the safe state with maximum probability of successful
    replanning, not necessarily the detection state or the last physically
    safe state.
