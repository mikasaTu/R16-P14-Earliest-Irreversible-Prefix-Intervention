  preregistration_amendments:
    - id: swept_path_structural_anchor_fix_1
      recorded_before_formal_calibration: true
      evidence_scope: calibration injection-instant structural screen only
      recovery_or_method_gain_inspected: false
      evaluation_or_heldout_demos_inspected: false
      change: >-
        Swept-path grid future leads [2,4,6,8] and first-motion anchor changed
        to leads [8,10,12,14] anchored at the first state reaching 65% of the
        demonstration plate path; lateral offsets changed from
        [0,0.015,0.030,0.045] to [0,0.025,0.050,0.075] m.
      reason: >-
        At the first-motion anchor the plate displacement over 2-8 actions is
        smaller than the combined plate/blocker footprint, so every fixed-grid
        placement is already in cause contact at injection and violates the
        environment-only delayed-invalidation contract.
    - id: swept_path_target_region_fix_2
      recorded_before_formal_calibration: true
      evidence_scope: calibration injection-instant structural screen only
      recovery_or_method_gain_inspected: false
      evaluation_or_heldout_demos_inspected: false
      change: >-
        The swept-path blocker grid was expressed as target path-progress
        fractions [0.70,0.80,0.90,1.00] from the first-motion chunk anchor,
        replacing 8-14 action leads.
      reason: >-
        Even 14 demonstration actions did not separate the large plate from
        the blocker footprint at injection. A later target-region blocker is
        structurally valid; if it does not yield 30-80% delayed nominal
        violations on calibration, the task remains a frozen negative result.
